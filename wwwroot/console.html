<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scon Interface</title>

    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            color: #ddd;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }

        header {
            padding: 10px;
            background: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #console {
            font-family: "Monoplex", monospace;
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            white-space: pre-wrap;
            background: #000;
            border-top: 1px solid #444;
            border-bottom: 1px solid #444;
        }

        #controls {
            font-family: "Monoplex", monospace;
            padding: 10px;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 8px;
            background: #222;
            border: 1px solid #444;
            color: white;
            font-family: monospace;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
        }

        .log-line {
            margin: 2px 0;
        }
    </style>
</head>

<body>
    <header>
        <span>Scon</span>
        <div>
            <a href="/logout" style="color: #ff4a4a; margin-left: 10px;">Logout</a>
        </div>
    </header>

    <div id="console"></div>

    <form id="controls">
        <input type="text" id="cmdInput" placeholder="Enter command..." autocomplete="off">
        <button type="submit">Send</button>
    </form>

    <script>
        const consoleDiv = document.getElementById('console');
        const form = document.getElementById('controls');
        const input = document.getElementById('cmdInput');
        const evtSource = new EventSource("/api/console");

        function addLog(text, color = null) {
            const div = document.createElement('div');
            div.className = 'log-line';
            div.textContent = text;
            if (color) {
                div.style.color = color;
            }

            consoleDiv.appendChild(div);
            
            // Auto scroll
            if (consoleDiv.scrollHeight - consoleDiv.scrollTop <= consoleDiv.clientHeight + 80) {
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }

            // Limit lines to last 1000
            while (consoleDiv.children.length > 1000) {
                consoleDiv.removeChild(consoleDiv.firstChild);
            }
        }

        function addInfo(text) {
            addLog(text, '#4aff4a');
        }

        function addError(text) {
            addLog(text, '#ff4a4a');
        }

        evtSource.onmessage = (event) => {
            addLog(event.data);
        };

        evtSource.onerror = (err) => {
            // If auth fails (401), EventSource usually just errors out.
            // We can check evtSource.readyState
        };

        form.onsubmit = async (e) => {
            e.preventDefault();
            const val = input.value.trim();
            if (!val) return;

            input.value = '';

            try {
                addInfo("> " + val);

                const res = await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: val })
                });

                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    addError("Error: " + (data.message || res.statusText));
                }
            } catch (ex) {
                console.error(ex);
            }
        };
    </script>
</body>

</html>
