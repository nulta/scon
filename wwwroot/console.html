<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scon Interface</title>

    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            color: #ddd;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }

        header {
            padding: 10px;
            background: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #main {
            flex: 1;
            display: flex;
            min-height: 0;
            border-top: 1px solid #444;
            border-bottom: 1px solid #444;
        }

        #console {
            font-family: 'MonoplexKR', monospace;
            flex: 1;
            min-width: 0;
            overflow-y: auto;
            padding: 10px;
            white-space: pre-wrap;
            background: #111;
        }

        #users {
            width: 180px;
            flex-shrink: 0;
            overflow-y: auto;
            padding: 10px;
            background: #1a1a1a;
            border-left: 1px solid #444;
        }

        #users h2 {
            margin: 0 0 8px;
            font-size: 0.85rem;
            font-weight: normal;
            color: #999;
        }

        #users ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        #users li {
            padding: 3px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #users li::before {
            content: "●";
            color: #4ade80;
            margin-right: 6px;
            font-size: 0.7em;
            vertical-align: middle;
        }

        #users li.me {
            color: var(--theme-color);
        }

        @media (max-width: 640px) {
            #users { display: none; }
        }

        #controls {
            font-family: 'MonoplexKR', monospace;
            padding: 10px;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 8px;
            background: #222;
            border: 1px solid #444;
            color: white;
            font-family: monospace;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
            background-color: #444;
            border: 1px solid #666;
            color: #eee;
            border-radius: 4px;
        }

        .log-line {
            margin: 2px 0;
            white-space: pre-wrap;
        }

        .logo {
            font-weight: bold;
            color: var(--theme-color);
        }

        .link-button {
            background: none;
            border: none;
            padding: 0;
            margin-left: 10px;
            color: #ff4a4a;
            text-decoration: underline;
            font: inherit;
        }

        .span-box > span:not(:first-child) {
            margin-inline: 0.25rem;
        }
    </style>
</head>

<body>
    <header>
        <div class="span-box">
            <span class="logo">Scon</span>
            <span id="username">...</span>
            <span id="current-utc">KST 00:00:00</span>
        </div>
        <div>
            <form method="post" action="/logout" style="display: inline">
                <button type="submit" class="link-button">Logout</button>
            </form>
        </div>
    </header>

    <div id="main">
        <div id="console"></div>
        <aside id="users">
            <h2>접속 중 (<span id="users-count">0</span>)</h2>
            <ul id="users-list"></ul>
        </aside>
    </div>

    <form id="controls">
        <input type="text" id="cmdInput" placeholder="help" autocomplete="off" value="status">
        <button type="submit">Send</button>
    </form>

    <script>
        const utcSpan = document.querySelector('#current-utc');
        const usernameSpan = document.querySelector('#username');

        const kstFormat = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Asia/Seoul',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            hourCycle: 'h23',
        });

        function updateTime() {
            utcSpan.textContent = 'KST ' + kstFormat.format(new Date());
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Session expired (60 min) or revoked: go back to the login page.
        function redirectToLogin() {
            window.location.href = '/';
        }

        let myNick = null;

        fetch('/api/whoami')
            .then(res => {
                if (res.status === 401 || res.status === 403) redirectToLogin();
                return res.json();
            })
            .then(data => {
                myNick = data.nick || null;
                usernameSpan.textContent = data.nick || "";
                renderUsers(lastUsers);
            })
            .catch(err => {
                console.error('Failed to fetch user info:', err);
            });
    </script>

    <script>
        const consoleDiv = document.getElementById('console');
        const form = document.getElementById('controls');
        const input = document.getElementById('cmdInput');
        const evtSource = new EventSource("/api/console");

        function addLog(text, color = null) {
            const div = document.createElement('div');
            div.className = 'log-line';
            div.textContent = text;
            if (color) {
                div.style.color = color;
            }

            consoleDiv.appendChild(div);
            
            // Auto scroll
            if (consoleDiv.scrollHeight - consoleDiv.scrollTop <= consoleDiv.clientHeight + 80) {
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }

            // Limit lines to last 1000
            while (consoleDiv.children.length > 1000) {
                consoleDiv.removeChild(consoleDiv.firstChild);
            }
        }

        function addInfo(text) {
            addLog(text, '#ffc954');
        }

        function addError(text) {
            addLog(text, '#ff4a4a');
        }

        function handleHelp() {
            addInfo("help - 명령어 목록:");
            addInfo("  status                           플레이어 목록을 표시합니다.");
            addInfo("  say [내용]                       전체 채팅을 보냅니다.");
            addInfo("  kick [대상] {사유}               사용자를 킥합니다.");
            addInfo("  banid [고유번호] {기간} {사유}   해당 고유번호를 밴 처리합니다.");
            addInfo("  bancheck [고유번호]              해당 고유번호의 밴 여부를 확인합니다.");
        }

        // The browser resends the last event id on reconnect, so the server only sends missed lines.
        // If ids go backwards, the server was restarted and is resending its history from scratch.
        let lastEventId = 0;
        evtSource.onmessage = (event) => {
            const id = Number(event.lastEventId) || 0;
            if (id && id <= lastEventId) {
                consoleDiv.replaceChildren();
            }
            lastEventId = id || lastEventId;
            addLog(event.data);
        };

        let lastUsers = [];
        function renderUsers(users) {
            lastUsers = users;
            const list = document.getElementById('users-list');
            document.getElementById('users-count').textContent = users.length;
            list.replaceChildren(...users.map(name => {
                const li = document.createElement('li');
                li.textContent = name;
                li.title = name;
                if (name === myNick) li.className = 'me';
                return li;
            }));
        }

        evtSource.addEventListener('users', (event) => {
            try {
                renderUsers(JSON.parse(event.data));
            } catch (ex) {
                console.error('Bad users event:', ex);
            }
        });

        evtSource.onerror = async () => {
            // EventSource retries on its own for network errors, but a 401/403 closes it for good.
            if (evtSource.readyState !== EventSource.CLOSED) return;
            try {
                const res = await fetch('/api/whoami');
                if (res.status === 401 || res.status === 403) {
                    redirectToLogin();
                    return;
                }
            } catch { }
            addError("콘솔 연결이 끊어졌습니다. 페이지를 새로고침하세요.");
        };

        form.onsubmit = async (e) => {
            e.preventDefault();
            const val = input.value.trim();
            if (!val) return;

            input.value = '';

            if (val.toLowerCase() === 'help') {
                handleHelp();
                return;
            }

            try {
                addInfo("> " + val);

                const res = await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: val })
                });

                if (res.status === 401 || res.status === 403) {
                    addError("세션이 만료되었습니다. 다시 로그인하세요.");
                    setTimeout(redirectToLogin, 1500);
                    return;
                }

                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    addError("Error: " + (data.message || res.statusText));
                }
            } catch (ex) {
                console.error(ex);
                addError("Error: 서버에 연결할 수 없습니다.");
            }
        };
    </script>
</body>

</html>
