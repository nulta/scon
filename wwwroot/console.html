<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scon Interface</title>

    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            color: #ddd;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }

        header {
            padding: 10px;
            background: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #main {
            flex: 1;
            display: flex;
            min-height: 0;
            border-top: 1px solid #444;
            border-bottom: 1px solid #444;
        }

        #console {
            font-family: 'MonoplexKR', monospace;
            flex: 1;
            min-width: 0;
            overflow-y: auto;
            padding: 10px;
            white-space: pre-wrap;
            background: #111;
        }

        #users {
            width: 180px;
            flex-shrink: 0;
            overflow-y: auto;
            padding: 10px;
            background: #1a1a1a;
            border-left: 1px solid #444;
        }

        #users h2 {
            margin: 0 0 8px;
            font-size: 0.85rem;
            font-weight: normal;
            color: #999;
        }

        #users ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        #users li {
            padding: 3px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #users li::before {
            content: "●";
            color: #4ade80;
            margin-right: 6px;
            font-size: 0.7em;
            vertical-align: middle;
        }

        #users-updated {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #777;
        }

        @media (max-width: 640px) {
            #users { display: none; }
        }

        #controls {
            font-family: 'MonoplexKR', monospace;
            padding: 10px;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 8px;
            background: #222;
            border: 1px solid #444;
            color: white;
            font-family: monospace;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
            background-color: #444;
            border: 1px solid #666;
            color: #eee;
            border-radius: 4px;
        }

        .log-line {
            margin: 2px 0;
            white-space: pre-wrap;
        }

        .logo {
            font-weight: bold;
            color: var(--theme-color);
        }

        .link-button {
            background: none;
            border: none;
            padding: 0;
            margin-left: 10px;
            color: #ff4a4a;
            text-decoration: underline;
            font: inherit;
        }

        .span-box > span:not(:first-child) {
            margin-inline: 0.25rem;
        }

        .steamid {
            cursor: pointer;
        }

        .steamid:hover {
            text-decoration: underline dotted;
            text-underline-offset: 2px;
        }

        .steamid.copied {
            color: var(--theme-color);
        }
    </style>
</head>

<body>
    <header>
        <div class="span-box">
            <span class="logo">Scon</span>
            <span id="username">...</span>
            <span id="current-utc">KST 00:00:00</span>
        </div>
        <div>
            <form method="post" action="/logout" style="display: inline">
                <button type="submit" class="link-button">Logout</button>
            </form>
        </div>
    </header>

    <div id="main">
        <div id="console"></div>
        <aside id="users">
            <h2>플레이어 (<span id="users-count">0</span>)</h2>
            <ul id="users-list"></ul>
            <div id="users-updated">정보 없음</div>
        </aside>
    </div>

    <form id="controls">
        <input type="text" id="cmdInput" placeholder="help" autocomplete="off" value="status">
        <button type="submit">Send</button>
    </form>

    <script>
        const utcSpan = document.querySelector('#current-utc');
        const usernameSpan = document.querySelector('#username');

        const kstFormat = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Asia/Seoul',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            hourCycle: 'h23',
        });

        function updateTime() {
            utcSpan.textContent = 'KST ' + kstFormat.format(new Date());
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Session expired (6 hours) or revoked.
        // 401: re-run the Discord login, which replaces the stale cookie and returns to the console.
        // 403: access got revoked, so the main page is all that remains.
        function relogin() {
            window.location.href = '/login';
        }

        function redirectToMain() {
            window.location.href = '/';
        }

        fetch('/api/whoami')
            .then(res => {
                if (res.status === 401) return relogin();
                if (res.status === 403) return redirectToMain();
                return res.json();
            })
            .then(data => {
                usernameSpan.textContent = data.nick || "";
            })
            .catch(err => {
                console.error('Failed to fetch user info:', err);
            });
    </script>

    <script>
        const consoleDiv = document.getElementById('console');
        const form = document.getElementById('controls');
        const input = document.getElementById('cmdInput');
        const evtSource = new EventSource("/api/console");

        function addLog(text, color = null) {
            const div = document.createElement('div');
            div.className = 'log-line';
            if (color) {
                div.textContent = text;
                div.style.color = color;
            } else {
                renderGameLine(div, text);
            }

            consoleDiv.appendChild(div);
            
            // Auto scroll
            if (consoleDiv.scrollHeight - consoleDiv.scrollTop <= consoleDiv.clientHeight + 80) {
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }

            // Limit lines to last 1000
            while (consoleDiv.children.length > 1000) {
                consoleDiv.removeChild(consoleDiv.firstChild);
            }
        }

        // --- Plain game log lines: muted timestamps, pastel nicknames (EasyChat.PastelizeNick), clickable SteamIDs ---
        const TS_RE = /^(\[\d{1,2}:\d{2}:\d{2}\])/;
        const CHAT_RE = /^([^:\[<(]{1,32}): (.*)$/;
        const STEAMID_RE = /\bSTEAM_[0-5]:[01]:\d+\b/g;
        const SPAWN_RE = /\bspawned (model|ragdoll|sent|NPC|vehicle|weapon)\b/;

        function appendClickable(parent, text) {
            let last = 0;
            for (const m of text.matchAll(STEAMID_RE)) {
                if (m.index > last) parent.append(text.slice(last, m.index));
                const id = document.createElement('span');
                id.className = 'steamid';
                id.textContent = m[0];
                parent.append(id);
                last = m.index + m[0].length;
            }
            if (last < text.length) parent.append(text.slice(last));
        }

        function appendWithColor(parent, text, color) {
            if (color) parent.style.color = color;
            appendClickable(parent, text);
        }

        function renderGameLine(div, text) {
            let rest = text;

            const ts = rest.match(TS_RE);
            if (ts) {
                const span = document.createElement('span');
                span.style.color = '#777';
                span.style.fontStyle = 'normal';
                span.textContent = ts[1];
                div.append(span);
                rest = rest.slice(ts[0].length);
            }

            const chat = rest.match(CHAT_RE);
            if (chat) {
                const span = document.createElement('span');
                span.style.color = nickColor(chat[1]);
                span.textContent = chat[1];
                div.append(span, ': ');
                appendClickable(div, chat[2]);
                return;
            }

            // Game events other than chat render in italics; spawn spam (props,
            // ragdolls, vehicles, NPCs, entities) is background noise, so gray as well.
            div.style.fontStyle = 'italic';
            appendWithColor(div, rest, SPAWN_RE.test(rest) ? '#999' : null);
        }

        // EasyChat.PastelizeNick: hash the nick (UTF-8 bytes), use it as an HSV hue.
        function nickColor(nick) {
            const bytes = new TextEncoder().encode(nick);
            let counter = 1;
            const len = bytes.length;
            for (let i = 0; i < len; i += 3) {
                counter = (counter * 8161) % 4294967279
                    + bytes[i] * 16776193
                    + (i + 1 < len ? bytes[i + 1] : len - i + 255) * 8372226
                    + (i + 2 < len ? bytes[i + 2] : len - i + 255) * 3932164;
            }
            const hue = counter % 4294967291;
            const rgb = hsvToRgb((hue % 180) * 2, hue % 3 === 0 ? 0.3 : 0.6, hue % 127 === 0 ? 0.6 : 1);
            return `rgb(${rgb.join(', ')})`;
        }

        function hsvToRgb(h, s, v) {
            const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
            const rgb = h < 60 ? [c, x, 0]
                : h < 120 ? [x, c, 0]
                : h < 180 ? [0, c, x]
                : h < 240 ? [0, x, c]
                : h < 300 ? [x, 0, c]
                : [c, 0, x];
            return rgb.map(ch => Math.round((ch + m) * 255));
        }

        consoleDiv.addEventListener('click', (e) => {
            if (!e.target.classList.contains('steamid')) return;
            navigator.clipboard?.writeText(e.target.textContent).then(() => {
                e.target.classList.add('copied');
                setTimeout(() => e.target.classList.remove('copied'), 500);
            }).catch(() => { });
        });

        function addInfo(text) {
            addLog(text, '#ffc954');
        }

        function addError(text) {
            addLog(text, '#ff4a4a');
        }

        function handleHelp() {
            addInfo("help - 명령어 목록:");
            addInfo("  status                           플레이어 목록을 표시합니다.");
            addInfo("  say [내용]                       전체 채팅을 보냅니다.");
            addInfo("  kick [대상] {사유}               사용자를 킥합니다.");
            addInfo("  banid [고유번호] {기간} {사유}   해당 고유번호를 밴 처리합니다.");
            addInfo("  bancheck [고유번호]              해당 고유번호의 밴 여부를 확인합니다.");
            addInfo("  그 외 텍스트                     전체 채팅으로 보냅니다.");
        }

        // The browser resends the last event id on reconnect, so the server only sends missed lines.
        // If ids go backwards, the server was restarted and is resending its history from scratch.
        let lastEventId = 0;
        evtSource.onmessage = (event) => {
            const id = Number(event.lastEventId) || 0;
            if (id && id <= lastEventId) {
                consoleDiv.replaceChildren();
            }
            lastEventId = id || lastEventId;
            addLog(event.data);
        };

        // Player list reported by the game server ([SCON_PLAYERS] lines in the log)
        function renderPlayers({ players, updatedAt }) {
            const list = document.getElementById('users-list');
            document.getElementById('users-count').textContent = updatedAt ? players.length : '?';
            list.replaceChildren(...players.map(p => {
                const li = document.createElement('li');
                li.textContent = p.name;
                li.title = p.steamid ? `${p.name}\n${p.steamid}` : p.name;
                return li;
            }));
            document.getElementById('users-updated').textContent = updatedAt
                ? '갱신 ' + kstFormat.format(new Date(updatedAt))
                : '정보 없음';
        }

        evtSource.addEventListener('players', (event) => {
            try {
                renderPlayers(JSON.parse(event.data));
            } catch (ex) {
                console.error('Bad players event:', ex);
            }
        });

        evtSource.onerror = async () => {
            // EventSource retries on its own for network errors, but a 401/403 closes it for good.
            if (evtSource.readyState !== EventSource.CLOSED) return;
            try {
                const res = await fetch('/api/whoami');
                if (res.status === 401) { relogin(); return; }
                if (res.status === 403) { redirectToMain(); return; }
            } catch { }
            addError("콘솔 연결이 끊어졌습니다. 페이지를 새로고침하세요.");
        };

        // Anything that is not a known command is treated as chat.
        const COMMANDS = new Set(['say', 'status', 'kick', 'banid', 'bancheck']);

        form.onsubmit = async (e) => {
            e.preventDefault();
            const val = input.value.trim();
            if (!val) return;

            input.value = '';

            if (val.toLowerCase() === 'help') {
                handleHelp();
                return;
            }

            const word = val.split(/ +/, 1)[0].toLowerCase();
            const command = COMMANDS.has(word) ? val : `say ${val}`;

            try {
                addInfo("> " + val);

                const res = await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command })
                });

                if (res.status === 401) {
                    addError("세션이 만료되었습니다. 다시 로그인하세요.");
                    setTimeout(relogin, 1500);
                    return;
                }

                if (res.status === 403) {
                    addError("접근이 거부되었습니다.");
                    setTimeout(redirectToMain, 1500);
                    return;
                }

                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    addError("Error: " + (data.message || res.statusText));
                }
            } catch (ex) {
                console.error(ex);
                addError("Error: 서버에 연결할 수 없습니다.");
            }
        };
    </script>
</body>

</html>
