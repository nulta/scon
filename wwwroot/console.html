<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scon Interface</title>

    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            color: #ddd;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }

        header {
            padding: 10px;
            background: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #console {
            font-family: "Monoplex", monospace;
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            white-space: pre-wrap;
            background: #111;
            border-top: 1px solid #444;
            border-bottom: 1px solid #444;
        }

        #controls {
            font-family: "Monoplex", monospace;
            padding: 10px;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 8px;
            background: #222;
            border: 1px solid #444;
            color: white;
            font-family: monospace;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
            background-color: #444;
            border: 1px solid #666;
            color: #eee;
            border-radius: 4px;
        }

        .log-line {
            margin: 2px 0;
            white-space: pre-wrap;
        }

        .logo {
            font-weight: bold;
            color: var(--theme-color);
        }

        .span-box > span:not(:first-child) {
            margin-inline: 0.25rem;
        }
    </style>
</head>

<body>
    <header>
        <div class="span-box">
            <span class="logo">Scon</span>
            <span id="username">...</span>
            <span id="current-utc">UTC 00:00:00</span>
        </div>
        <div>
            <a href="/logout" style="color: #ff4a4a; margin-left: 10px;">Logout</a>
        </div>
    </header>

    <div id="console"></div>

    <form id="controls">
        <input type="text" id="cmdInput" placeholder="help" autocomplete="off">
        <button type="submit">Send</button>
    </form>

    <script>
        const utcSpan = document.querySelector('#current-utc');
        const usernameSpan = document.querySelector('#username');

        function updateTime() {
            const now = new Date();
            const utcString = now.toISOString().substr(11, 8);
            utcSpan.textContent = 'UTC ' + utcString;
        }
        setInterval(updateTime, 1000);
        updateTime();

        fetch('/api/whoami')
            .then(res => res.json())
            .then(data => {
                usernameSpan.textContent = data.nick || "";
            })
            .catch(err => {
                console.error('Failed to fetch user info:', err);
            });
    </script>

    <script>
        const consoleDiv = document.getElementById('console');
        const form = document.getElementById('controls');
        const input = document.getElementById('cmdInput');
        const evtSource = new EventSource("/api/console");

        function addLog(text, color = null) {
            const div = document.createElement('div');
            div.className = 'log-line';
            div.textContent = text;
            if (color) {
                div.style.color = color;
            }

            consoleDiv.appendChild(div);
            
            // Auto scroll
            if (consoleDiv.scrollHeight - consoleDiv.scrollTop <= consoleDiv.clientHeight + 80) {
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }

            // Limit lines to last 1000
            while (consoleDiv.children.length > 1000) {
                consoleDiv.removeChild(consoleDiv.firstChild);
            }
        }

        function addInfo(text) {
            addLog(text, '#4aff4a');
        }

        function addError(text) {
            addLog(text, '#ff4a4a');
        }

        function handleHelp() {
            addInfo("help - 명령어 목록:");
            addInfo("  status           플레이어 목록을 표시합니다.");
            addInfo("  say [내용]       전체 채팅을 보냅니다.");
            addInfo("  kick [대상] {사유}    사용자를 킥합니다.");
            addInfo("  banid [고유번호] {기간} {사유}     해당 고유번호를 밴 처리합니다.");
            addInfo("  bancheck [고유번호]     해당 고유번호의 밴 여부를 확인합니다.");
        }

        evtSource.onmessage = (event) => {
            addLog(event.data);
        };

        evtSource.onerror = (err) => {
            // If auth fails (401), EventSource usually just errors out.
            // We can check evtSource.readyState
        };

        form.onsubmit = async (e) => {
            e.preventDefault();
            const val = input.value.trim();
            if (!val) return;

            input.value = '';

            try {
                addInfo("> " + val);

                const res = await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: val })
                });

                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    addError("Error: " + (data.message || res.statusText));
                }
            } catch (ex) {
                console.error(ex);
            }
        };
    </script>
</body>

</html>
