<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scon</title>

    <link rel="stylesheet" href="styles.css">
    <style>
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            line-height: 110%;
            color: var(--theme-color);
        }

        p {
            font-size: 1rem;
            opacity: 0.4;
            margin-top: 0;
            margin-bottom: 2rem;
        }

        button {
            padding: 0.75rem 2rem;
            font-size: 1rem;
            cursor: pointer;

            background-color: #eee;
            border: none;
            border-radius: 6px;
            color: #111;
            transition: background-color 0.1s;

            &:hover {
                background-color: #ddd;
            }
        }

        #unauthorized {
            margin-top: 2rem;
            color: #ff4a4a88;
        }
    </style>
</head>
<body>
    <main>
        <h1>Scon</h1>
        <p>Remote Server Console</p>

        <button onclick="window.location='/console'">로그인</button>

        <div id="unauthorized" style="display: none">
        </div>
    </main>

    <script>
        if (window.location.pathname.includes('/unauthorized')) {
            document.getElementById('unauthorized').style.display = '';
            document.getElementById('unauthorized').textContent = '접근이 거부되었습니다.';
        }
    </script>
</body>
</html>
